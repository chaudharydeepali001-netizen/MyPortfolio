<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me | Deepali</title>
    <link rel="stylesheet" href="about.css">
</head>

<body>

    <!-- Background Effects -->
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <!-- Top Heading -->
    <header class="page-header">
        <a href="index.html" class="back-home">← Home</a>
        <h1>About <span>Me</span></h1>
        <p>Get to know more about my journey</p>
    </header>

    <!-- Main Circular Menu -->
    <main class="orbit-container">

        <button class="orbit-item item-1" data-section="education">
            <span class="menu-icon">🎓</span>
            <span>Education</span>
        </button>

        <button class="orbit-item item-2" data-section="skills">
            <span class="menu-icon">💻</span>
            <span>Skills</span>
        </button>

        <button class="orbit-item item-3" data-section="projects">
            <span class="menu-icon">🚀</span>
            <span>Projects</span>
        </button>

        <button class="orbit-item item-4" data-section="hobbies">
            <span class="menu-icon">🎨</span>
            <span>Hobbies</span>
        </button>

        <!-- Central Profile -->
        <div class="profile-center">
            <div class="profile-circle">
                <img src="images\profile-pic.jpg.jpeg"
                     alt="Deepali's Profile Photo"
                     onerror="this.style.display='none';">
                <span class="profile-fallback">D</span>
            </div>

            <h2>hey!<span>Let's know about me..</span></h2>
            <p>MCA Student | Technology Enthusiast</p>
            <div class="center-line"></div>
            <small>Explore my world</small>
        </div>

        <button class="orbit-item item-5" data-section="career">
            <span class="menu-icon">🎯</span>
            <span>Career Goals</span>
        </button>

        <button class="orbit-item item-6" data-section="achievements">
            <span class="menu-icon">🏆</span>
            <span>Achievements</span>
        </button>

        <button class="orbit-item item-7" data-section="personal">
            <span class="menu-icon">🌸</span>
            <span>Personal Details</span>
        </button>

        <button class="orbit-item item-8" data-section="contact">
            <span class="menu-icon">✉️</span>
            <span>Contact</span>
        </button>

    </main>
    <!-- CREATIVE CORNER LINK -->
<a href="hobbies.html" class="creative-link">
    <div class="creative-icon">
        🎨
    </div>

    <div class="creative-text">
        <h3>Creative Corner</h3>
        <p>My Art & Craft</p>
        <span>Explore My Creativity →</span>
    </div>
</a>

    <!-- Information Panel -->
    <div class="panel-overlay" id="panelOverlay">

        <div class="info-panel">

            <button class="close-panel" id="closePanel">×</button>

            <div class="panel-icon" id="panelIcon">🎓</div>

            <h2 id="panelTitle">Education</h2>

            <div class="panel-content" id="panelContent">
                Select a category to explore.
            </div>

        </div>

    </div>

    <script>
        const sectionData = {

            education: {
                icon: "🎓",
                title: "My Education",
                content: `
                    <div class="info-card">
                        <h3>Master of Computer Applications (MCA)</h3>
                        <p>Rayat Bahra Professional University, Hoshiarpur</p>
                        <p>Currently Pursuing</p>
                    </div>

                    <div class="info-card">
                        <h3>Bachelor of Computer Applications (BCA)</h3>
                        <p>Completed Graduation</p>
                    </div>

                    <div class="info-card">
                        <h3>12th Standard</h3>
                        <p>Medical Stream with Health Care Subject</p>
                    </div>
                `
            },

            skills: {
                icon: "💻",
                title: "My Skills",
                content: `
                    <div class="info-card">
                        <h3>Programming Languages</h3>
                        <p>Java, Python, C</p>
                    </div>

                    <div class="info-card">
                        <h3>Web Development</h3>
                        <p>HTML, CSS</p>
                    </div>

                    <div class="info-card">
                        <h3>Database</h3>
                        <p>DBMS, RDBMS, MySQL</p>
                    </div>

                    <div class="info-card">
                        <h3>Other Skills</h3>
                        <p>Problem Solving, Communication, Teamwork</p>
                    </div>
                `
            },

            projects: {
                icon: "🚀",
                title: "My Projects",
                content: `
                    <div class="info-card">
                        <h3>World Tour – Travel Booking Website</h3>
                        <p>A travel booking project with destination packages,
                        customer registration, bookings and payment features.</p>
                        <p><strong>Technology:</strong> HTML, CSS, Python, Flask, MySQL</p>
                    </div>

                    <div class="info-card">
                        <h3>Personal Portfolio Website</h3>
                        <p>A personal website to showcase my education,
                        skills, projects and career journey.</p>
                        <p><strong>Technology:</strong> HTML and CSS</p>
                    </div>
                `
            },

            hobbies: {
                icon: "🎨",
                title: "My Hobbies",
                content: `
                    <div class="info-card">
                        <h3>My Interests</h3>
                        <p>Learning new technologies</p>
                        <p>Exploring creative ideas</p>
                        <p>Listening to music</p>
                        <p>Improving my knowledge and skills</p>
                    </div>
                `
            },

            career: {
                icon: "🎯",
                title: "Career Goals",
                content: `
                    <div class="info-card">
                        <h3>My Career Vision</h3>
                        <p>To build a successful career in the IT industry.</p>
                        <p>To improve my programming and problem-solving skills.</p>
                        <p>To work with a reputed international company
                        and gain global experience.</p>
                    </div>
                `
            },

            achievements: {
                icon: "🏆",
                title: "My Achievements",
                content: `
                    <div class="info-card">
                        <h3>Academic Journey</h3>
                        <p>Successfully completed BCA.</p>
                        <p>Currently pursuing MCA.</p>
                    </div>

                    <div class="info-card">
                        <h3>Project Experience</h3>
                        <p>Developed a travel booking website as a project.</p>
                    </div>
                `
            },

            personal: {
                icon: "🌸",
                title: "Personal Details",
                content: `
                    <div class="info-card">
                        <h3>About Me</h3>
                        <p><strong>Name:</strong> Deepali</p>
                        <p><strong>Hometown:</strong> Una, Himachal Pradesh</p>
                        <p><strong>Qualification:</strong> BCA</p>
                        <p><strong>Current Study:</strong> MCA</p>
                    </div>

                    <div class="info-card">
                        <h3>My Personality</h3>
                        <p>Curious, creative and always willing to learn
                        something new.</p>
                    </div>
                `
            },

            contact: {
                icon: "✉️",
                title: "Contact Me",
                content: `
                    <div class="info-card">
                        <h3>Let's Connect!</h3>
                        <p>Email: Add your email address here</p>
                        <p>LinkedIn: Add your LinkedIn profile here</p>
                        <p>GitHub: Add your GitHub profile here</p>
                    </div>
                `
            }
        };

        const overlay = document.getElementById("panelOverlay");
        const panelIcon = document.getElementById("panelIcon");
        const panelTitle = document.getElementById("panelTitle");
        const panelContent = document.getElementById("panelContent");
        const closePanel = document.getElementById("closePanel");

        document.querySelectorAll(".orbit-item").forEach(button => {

            button.addEventListener("click", function () {

                const section = this.dataset.section;
                const data = sectionData[section];

                panelIcon.textContent = data.icon;
                panelTitle.textContent = data.title;
                panelContent.innerHTML = data.content;

                overlay.classList.add("active");
            });

        });

        closePanel.addEventListener("click", function () {
            overlay.classList.remove("active");
        });

        overlay.addEventListener("click", function (event) {
            if (event.target === overlay) {
                overlay.classList.remove("active");
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                overlay.classList.remove("active");
            }
        });
    </script>

</body>
</html>
